<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>TypeScript 30 导航</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 2rem; background: #280000; color: #e1d3d3; }
    h1 { color: #ffd9d9; border-bottom: 4px solid #ccc; padding-bottom: 10px; }
    ul { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 15px; }
    li { background: rgb(91, 0, 0); padding: 15px; border-radius: 8px; box-shadow: 0 2px 4px rgba(255, 173, 173, 0.1); transition: transform 0.3s, box-shadow 0.2s; }
    li:hover { transform: translateY(-5px) scaleY(1.5) scaleX(1.2); box-shadow: 0 4px 6px rgba(255, 175, 175, 0.5); }
    a { text-decoration: none; color: #ffbdd8; display: block; font-weight: 600; font-size: 16px; }
    span.badge { font-size: 12px; padding: 2px 6px; border-radius: 10px; margin-left: 8px; font-weight: normal;}
    .start { background: #ffbaba; color: #850404; }
    .finished { background: #000000; color: #ffcfdc; }
  </style>
</head>
<body>
  <h1> TS30 FROM JS30</h1>
  <p>点击下方链接直接进入（ Vite 动态实时构建）：</p>
  <ul id="nav"></ul>
  <script type="module" src="/main.ts"></script>
</body>
</html>
