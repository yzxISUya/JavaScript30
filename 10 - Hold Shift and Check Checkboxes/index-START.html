<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hold Shift to Check Multiple Checkboxes</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
  <style>

    html {
      font-family: sans-serif;
      background: #ffc600;
    }

    .inbox {
      max-width: 400px;
      margin: 50px auto;
      background: white;
      border-radius: 10px;
      box-shadow: 10px 10px 0 rgba(0,0,0,0.2);
    }

    .item {
      display: flex;
      align-items: center;
      border-bottom: 2px solid #f0f0f0;
    }

    .item:last-child {
      border-bottom: 0;
    }

    input:checked + p { /*checked是一个伪类，语法：“元素+状态”， “+”是相邻兄弟选择器， 补充：“>”是子元素选择器*/
      background: #F9F9F9;
      text-decoration: line-through;
    }

    input[type="checkbox"] {
      margin: 20px;
    }

    p {
      margin: 0;
      padding: 20px;
      transition: background 0.2s;
      flex: 1;
      font-family:'helvetica neue';
      font-size: 20px;
      font-weight: 200;
      border-left: 1px solid #d4d8de;
    }
  </style>
   <!--
   The following is a common layout you would see in an email client.

   When a user clicks a checkbox, holds Shift, and then clicks another checkbox a few rows down, all the checkboxes inbetween those two checkboxes should be checked.

  -->
  <div class="inbox">
    <div class="item">
      <input type="checkbox">
      <p>This is an inbox layout.</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Check one item</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Hold down your Shift key</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Check a lower item</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Everything in between should also be set to checked</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Try to do it without any libraries</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Just regular JavaScript</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Good Luck!</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Don't forget to tweet your result!</p>
    </div>
  </div>

<script>
//我说实话我这个写得比他好吧，可读性高多了，效率也高多了，他那个纯高级感，装b用的，不过状态变量确实可以学学
const checkboxes = Array.from(document.querySelectorAll('.inbox input[type = "checkbox"]'));

let lastChecked;

function handleCheck(e){
  if(lastChecked && e.shiftKey && this.checked){//.checked是checkbox的特有属性，表示“是否被勾选”
    for(let i = checkboxes.indexOf(lastChecked);i < checkboxes.indexOf(this);i++){
      checkboxes[i].checked = true;
    }
    for(let i = checkboxes.indexOf(lastChecked);i > checkboxes.indexOf(this);i--){
      checkboxes[i].checked = true;
    }
  }

  lastChecked = this;
}

checkboxes.forEach(checkbox => checkbox.addEventListener('click', handleCheck));
</script>
</body>
</html>
