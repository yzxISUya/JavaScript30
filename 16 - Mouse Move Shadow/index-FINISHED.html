<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mouse Shadow</title>
  <link rel="icon" href="https://fav.farm/✅" />
</head>
<body>

  <div class="hero">
    <h1 contenteditable>🔥WOAH!</h1>
  </div>

  <style>
  html {
    color: black;
    font-family: sans-serif;
  }

  body {
    margin: 0;
  }

  .hero {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: black;
  }

  h1 {
    text-shadow: 10px 10px 0 rgba(0,0,0,1);
    font-size: 100px;
  }
  </style>

//这节课还是建议看视频，自己想就是会有点懵
<script>
  const hero = document.querySelector('.hero');
  const text = hero.querySelector('h1');
  const walk = 500; // 500px

  function shadow(e) {
    const { offsetWidth: width, offsetHeight: height } = hero; //结构式赋值
    let { offsetX: x, offsetY: y } = e;

    //this永远是事件绑定的元素，这里是：hero
    //e.target在这里是鼠标所指向的目标
    //下面这个if把x和y统一变为相对hero的坐标
    if (this !== e.target) {
      x = x + e.target.offsetLeft;
      y = y + e.target.offsetTop;
    }
    //e.target.offsetLeft / offsetTop 是子元素（e.target）相对于父元素（this）的偏移量。

    const xWalk = Math.round((x / width * walk) - (walk / 2));
    const yWalk = Math.round((y / height * walk) - (walk / 2));

    text.style.textShadow = `
      ${xWalk}px ${yWalk}px 0 rgba(255,0,255,0.5),
      ${xWalk * -1}px ${yWalk}px 0 rgba(0,255,255,0.5),
      ${yWalk}px ${xWalk * -1}px 0 rgba(0,255,0,0.5),
      ${yWalk * -1}px ${xWalk}px 0 rgba(0,0,255,0.5)
    `;

  }

  hero.addEventListener('mousemove', shadow);
</script>
</body>
</html>
